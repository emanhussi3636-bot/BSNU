<section class="hero pos-rel" [class.scrolled]="scrolled">
    <div class="container">
        <div class="hero-wrapper">
            <div #heroSwiper class="hero-slider swiper-container mySwiper">
                <div class="swiper-wrapper" *ngIf="banners.length">
                    <div class="bg_img swiper-slide" *ngFor="let banner of banners">
                        <img class="hero-slide-image" [src]="banner.imageUrl" [alt]="banner.title">
                        <div class="hero__content-wrap text-center pt-55">
                            <div class="section-title clr-white">
                                <span class="sub-title">{{ langService.translate('HERO.TITLE') }}</span>
                                <h1 class="title">{{ banner.title }}</h1>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="hero-state" *ngIf="isLoading" role="status">
                    {{ langService.translate('HERO.BANNERS_LOADING') }}
                </div>
                <div class="hero-state hero-state--error" *ngIf="loadError" role="alert">
                    {{ langService.translate('HERO.BANNERS_ERROR') }}
                </div>

                <div class="swiper-pagination carousel-indicators" *ngIf="banners.length > 1"></div>
                <button class="carousel-control-prev" type="button" aria-label="Previous slide"
                    [disabled]="banners.length < 2">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                </button>
                <button class="carousel-control-next" type="button" aria-label="Next slide"
                    [disabled]="banners.length < 2">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>
</section>
